<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>统计分析 · 声音侦探</title>
  <link rel="stylesheet" href="/public/admin.css?v=0.1089-20260820">
</head>
<body>
  <aside>
    <div class="logo">声音<span>侦探</span></div>
    <small>管理后台</small>
    <nav>
      <a href="/admin.html">声音管理</a>
      <a href="/admin-users.html">用户管理</a>
      <a class="active" href="/admin-analytics.html">统计分析</a>
    </nav>
  </aside>
  <main>
    <header>
      <div>
        <h1>统计分析</h1>
        <p id="analyticsUpdated">正在读取埋点数据...</p>
      </div>
      <button id="refreshAnalytics" type="button">刷新</button>
    </header>
    <section class="metric-grid" id="metricGrid"></section>
    <section class="panel analytics-panel">
      <h2>录音与识别</h2>
      <div class="metric-grid compact" id="recordingGrid"></div>
    </section>
    <section class="panel analytics-panel">
      <h2>ASR 服务分组</h2>
      <div class="table-wrap">
        <table class="analytics-table">
          <thead><tr><th>服务</th><th>配置</th><th>分配轮数</th><th>完成率</th><th>连接成功</th><th>识别成功</th><th>错误率</th><th>首字 P50</th><th>最终 P50</th></tr></thead>
          <tbody id="asrRows"></tbody>
        </table>
      </div>
    </section>
    <section class="panel analytics-panel">
      <h2>系统与浏览器</h2>
      <div class="metric-grid compact" id="clientGrid"></div>
      <div id="clientPills" class="event-pills analytics-pills"></div>
      <div class="table-wrap">
        <table class="analytics-table">
          <thead><tr><th>用户</th><th>系统</th><th>浏览器</th><th>设备</th><th>最近访问</th></tr></thead>
          <tbody id="clientRows"></tbody>
        </table>
      </div>
    </section>
    <section class="panel analytics-panel">
      <h2>语音链路问题</h2>
      <div class="metric-grid compact" id="issueGrid"></div>
      <div class="table-wrap">
        <table class="analytics-table">
          <thead><tr><th>问题</th><th>次数</th><th>最近发生</th></tr></thead>
          <tbody id="issueRows"></tbody>
        </table>
      </div>
      <h3>按系统/浏览器拆分</h3>
      <div class="table-wrap">
        <table class="analytics-table">
          <thead><tr><th>系统/浏览器</th><th>点击回答</th><th>开始率</th><th>上传率</th><th>识别率</th><th>无文字</th><th>错误/播放问题</th></tr></thead>
          <tbody id="clientRecordingRows"></tbody>
        </table>
      </div>
    </section>
    <section class="panel analytics-panel">
      <h2>页面停留</h2>
      <div class="table-wrap">
        <table class="analytics-table">
          <thead><tr><th>页面/区块</th><th>次数</th><th>平均停留</th><th>P95</th><th>最长</th></tr></thead>
          <tbody id="pageRows"></tbody>
        </table>
      </div>
    </section>
    <section class="panel analytics-panel">
      <h2>接口耗时</h2>
      <div class="table-wrap">
        <table class="analytics-table">
          <thead><tr><th>接口</th><th>请求数</th><th>错误</th><th>平均耗时</th><th>P95</th><th>最近</th></tr></thead>
          <tbody id="apiRows"></tbody>
        </table>
      </div>
    </section>
    <section class="panel analytics-panel">
      <h2>事件分布</h2>
      <div id="eventCounts" class="event-pills"></div>
    </section>
    <section class="panel analytics-panel">
      <h2>最近事件</h2>
      <div class="table-wrap">
        <table class="analytics-table">
          <thead><tr><th>时间</th><th>事件</th><th>用户/设备</th><th>页面</th><th>详情</th></tr></thead>
          <tbody id="recentRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/public/admin-analytics.js?v=0.1089-20260820"></script>
</body>
</html>
