<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>声音侦探</title>
  <link rel="stylesheet" href="/public/style.css?v=0.3.8-20261009">
</head>
<body>
  <main class="app">
    <section id="welcome">
      <button id="changelogOpen" class="version-chip" type="button" aria-label="查看更新日志" title="更新日志">
        <span class="changelog-icon" aria-hidden="true">i</span>
        <span id="appVersion">0.3.8-20261009</span>
      </button>
      <a class="home-team-link" href="/team.html">Credits</a>
      <div class="hero">
        <h1 class="brand-title">
          <img src="/public/brand-wordmark.svg?v=0.3.8-20261009" alt="声音侦探">
        </h1>
        <p class="hero-subtitle">听声音，说出它是什么</p>
        <span class="good-things-beat" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <figure class="howto-card">
        <img class="howto-image" src="/public/how-to-play-match-cartoon.png?v=0.3.8-20261009" alt="一只手正把火柴划过火柴盒侧面的磷面并点燃">
        <figcaption class="howto-copy">
          <span>听到“嚓”的摩擦声</span>
          <small>你可以回答</small>
          <span class="howto-answers"><strong>划火柴</strong><strong>火柴</strong></span>
        </figcaption>
      </figure>
      <aside class="voice-ready-note" aria-label="游玩准备">
        <span class="voice-ready-icon" aria-hidden="true"></span>
        <p><strong>开始时请允许使用麦克风</strong><span>打开设备音量，戴耳机听得更清楚</span></p>
      </aside>
      <div class="card">
        <label for="name">你的昵称</label>
        <input class="input" id="name" maxlength="20" placeholder="给自己起个名字" autocomplete="nickname" value="头号玩家">
        <button class="primary" id="start" type="button">开始挑战</button>
        <button class="share history-open" id="historyOpen" type="button">历史成绩</button>
        <button class="share ranking-open" id="rankingOpen" type="button">排行榜</button>
        <button class="share" data-feedback type="button">用户反馈</button>
      </div>
      <a class="studio-link" href="https://stardream.studio/" target="_blank" rel="noopener noreferrer">
        <img class="studio-link-favicon" src="https://stardream.studio/favicon-seedream.png" alt="" aria-hidden="true">
        <span>stardream.studio</span>
        <span class="studio-link-arrow" aria-hidden="true">↗</span>
      </a>
      <button class="good-things-easter-egg" id="goodThingsEasterEgg" type="button" aria-label="发现一个声音彩蛋" aria-describedby="goodThingsNote" title="声音彩蛋">
        <img class="good-things-sketch" src="/public/good-things-vignette.png?v=0.3.8-20261009" alt="三个人围着小鼓聆听日常声音的原创插画">
      </button>
      <p class="good-things-note" id="goodThingsNote" aria-live="polite" hidden></p>
    </section>

    <section id="quiz" class="hidden">
      <div class="game-title">
        <div class="brand">声音<i>侦探</i></div>
        <div class="question" id="qcount">第 1 题 / 共 5 题</div>
      </div>
      <div class="steps" id="steps"></div>
      <div class="quiz-focus">
        <div class="sound-stage" id="audioOrb">
          <div class="sound-badge" id="soundStageBadge">第 1 题</div>
          <div class="sound-wave" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i>
          </div>
          <span id="soundStageText">准备播放</span>
        </div>
        <div class="replay-zone" aria-label="声音线索">
          <div class="playback-control">
            <div class="playback-copy">
              <span>声音线索</span>
              <strong id="playbackControlText">准备播放</strong>
            </div>
            <div class="playback-actions">
              <button class="skip-playback" id="skipPlayback" type="button" hidden>我猜到了！</button>
              <button class="replay" id="replay" type="button">↻ 再听一次</button>
            </div>
          </div>
        </div>
      </div>
      <div class="answer-area" hidden>
        <div class="answer-wrap">
          <div id="speechCaption" class="speech-caption waiting" aria-live="polite" aria-label="实时语音字幕">
            <span class="caption-speaker">你说</span>
            <div class="caption-line">
              <span id="recognitionText" class="recognition-text placeholder" data-text="">等待你开口</span>
              <i class="caption-cursor" aria-hidden="true"></i>
            </div>
          </div>
          <div id="answerDock" class="answer-dock preparing">
            <div class="listening-indicator" aria-hidden="true">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
            <strong id="listeningStatus" class="listening-status">准备中</strong>
            <p id="voiceSupport" class="voice-support">声音播放后自动收音</p>
            <div class="voice-actions">
              <button id="stopAnswerButton" class="stop-answer-button hidden" type="button"><span aria-hidden="true"></span>停止并提交</button>
              <button id="retryAnswerButton" class="retry-answer-button hidden" type="button">重新回答</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="feedback" class="feedback hidden">
      <div class="result-icon" id="resultIcon"></div>
      <h1 id="resultTitle"></h1>
      <p id="resultText"></p>
      <button class="primary next" id="next" type="button">下一题</button>
    </section>

    <section id="summary" class="summary-page hidden">
      <h1>你的侦查成果</h1>
      <div class="result-stage">
        <div class="result-art">
          <img class="result-art-bg" id="summaryImageBg" alt="" aria-hidden="true">
          <img class="result-art-main" id="summaryImage" alt="">
        </div>
        <div class="result-copy">
          <div class="score" id="score"></div>
          <p class="result-sub">本轮猜中 <span id="correctNum"></span> 题</p>
          <p class="result-quote" id="summaryQuote"></p>
        </div>
      </div>
      <div class="card answer-review">
        <b>本轮答案</b>
        <div id="answerReview"></div>
      </div>
      <div class="card ranking">
        <b>排行榜</b>
        <div id="ranking"></div>
      </div>
      <button class="primary" id="again" type="button">再来 5 题</button>
      <button class="share" data-feedback type="button">用户反馈</button>
    </section>

    <section id="complete" class="finish summary-page hidden">
      <div class="eyebrow">全部完成</div>
      <h1>你完成了<br>所有声音挑战！</h1>
      <div class="result-stage complete-stage">
        <div class="result-art">
          <img class="result-art-bg" id="completeImageBg" alt="" aria-hidden="true">
          <img class="result-art-main" id="completeImage" alt="">
        </div>
        <div class="result-copy">
          <p class="result-quote" id="completeQuote"></p>
          <b id="finishRank"></b>
          <p class="result-sub" id="finishText"></p>
          <p class="good-things-line">生活里的声音，都是好东西</p>
        </div>
      </div>
      <div class="card answer-review">
        <b>本轮答案</b>
        <div id="completeAnswerReview"></div>
      </div>
      <div class="card ranking">
        <b>完成榜</b>
        <div id="completeRanking"></div>
      </div>
      <button class="primary" id="completeAgain" type="button">重新开始</button>
      <button class="share" data-feedback type="button">用户反馈</button>
    </section>
  </main>
  <div class="modal hidden" id="changelogModal" role="dialog" aria-modal="true" aria-labelledby="changelogTitle">
    <div class="modal-backdrop" id="changelogBackdrop"></div>
    <div class="modal-card changelog-card">
      <div class="modal-head">
        <div>
          <span>更新日志</span>
          <b id="changelogTitle">0.3.8-20261009</b>
        </div>
        <button id="changelogClose" type="button" aria-label="关闭更新日志">×</button>
      </div>
      <div class="changelog-list" id="changelogList"></div>
    </div>
  </div>
  <div class="modal hidden" id="historyModal" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
    <div class="modal-backdrop" id="historyBackdrop"></div>
    <div class="modal-card history-card">
      <div class="modal-head">
        <div>
          <b id="historyTitle">历史成绩</b>
        </div>
        <button id="historyClose" type="button" aria-label="关闭过往成绩">×</button>
      </div>
      <div class="history-content" id="historyContent"></div>
    </div>
  </div>
  <div class="modal hidden" id="rankingModal" role="dialog" aria-modal="true" aria-labelledby="rankingTitle">
    <div class="modal-backdrop" id="rankingBackdrop"></div>
    <div class="modal-card ranking-card">
      <div class="modal-head">
        <div>
          <span>累计答对</span>
          <b id="rankingTitle">排行榜</b>
        </div>
        <button id="rankingClose" type="button" aria-label="关闭排名">×</button>
      </div>
      <div class="history-content ranking-content" id="rankingContent">
        <div class="ranking-columns" aria-hidden="true"><span>名次</span><span>玩家</span><span>答对</span></div>
        <div id="homeRanking"></div>
      </div>
    </div>
  </div>
  <div class="modal hidden" id="feedbackModal" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle">
    <div class="modal-backdrop" id="feedbackBackdrop"></div>
    <div class="modal-card feedback-card"><div class="modal-head"><div><span>声音侦探</span><b id="feedbackTitle">用户反馈</b></div><button id="feedbackClose" type="button" aria-label="关闭">×</button></div><form id="feedbackForm" class="feedback-form"><textarea id="feedbackContent" maxlength="2000" rows="6" required placeholder="请告诉我们你的想法或遇到的问题"></textarea><button id="feedbackSubmit" class="primary" type="submit">提交反馈</button></form></div>
  </div>
  <div class="toast hidden" id="toast"></div>
  <script src="/public/shared/voice-asr-client.js?v=0.3.8-20261009"></script>
  <script src="/public/changelog-classification.js?v=0.3.8-20261009"></script>
  <script src="/public/app.js?v=0.3.8-20261009"></script>
</body>
</html>
