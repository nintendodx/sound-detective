[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  DX100_STORAGE = "netlify-blobs"
  STT_PROVIDER = "baidu"
  BAIDU_ASR_FORMAT = "pcm"
  BAIDU_ASR_RATE = "16000"
  BAIDU_ASR_DEV_PID = "80001"
  BAIDU_ASR_CUID = "voice-detective-cloud"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = [
    "server.js",
    "public/admin.html",
    "public/admin-users.html",
    "public/admin-tags.html",
    "public/admin-analytics.html",
    "public/admin.js",
    "public/admin-users.js",
    "public/admin-tags.js",
    "public/admin-analytics.js",
    "public/admin.css",
    "data/engineering-stats.json"
  ]
